{{- if .Values.grafana.enabled }}
{{- $url := .Values.postgres.url | default "" }}
{{- $host := regexReplaceAll ":\\d+$" $url "" }}
{{- $port := "5432" }}
{{- if contains ":" $url }}
  {{- $port = regexFind "\\d+$" $url }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-forecast-app
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
data:
  apps.yaml: |
    apiVersion: 1
    apps:
      - type: eduardkolotushin-forecast-app
        org_id: 1
        disabled: false
        {{- if or $host .Values.grafana.retrainCron }}
        jsonData:
          {{- if $host }}
          storeHost: {{ $host | quote }}
          storePort: {{ $port | int }}
          storeDatabase: {{ .Values.postgres.database | quote }}
          storeUser: {{ .Values.postgres.user | quote }}
          storeSslMode: disable
          {{- end }}
          {{- if .Values.grafana.retrainCron }}
          retrainCron: {{ .Values.grafana.retrainCron | quote }}
          {{- end }}
        {{- end }}
        {{- if or $host .Values.grafana.pluginToken }}
        secureJsonData:
          {{- if $host }}
          storePassword: {{ .Values.postgres.password | quote }}
          {{- end }}
          {{- if .Values.grafana.pluginToken }}
          grafanaToken: {{ .Values.grafana.pluginToken | quote }}
          {{- end }}
        {{- end }}
{{- end }}
