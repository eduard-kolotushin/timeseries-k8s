{{- if .Values.grafana.enabled }}
{{- $address := include "timeseries.postgresAddress" (dict "raw" .Values.postgres.url) | splitList "|" }}
{{- $host := index $address 0 }}
{{- $port := index $address 1 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-forecast-app
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
data:
  apps.yaml: |
    apiVersion: 1
    apps:
      - type: eduardkolotushin-forecast-app
        org_id: 1
        disabled: false
        {{- if or $host .Values.grafana.retrainCron .Values.compute.enabled }}
        jsonData:
          {{- if $host }}
          storeHost: {{ $host | quote }}
          storePort: {{ $port | int }}
          storeDatabase: {{ .Values.postgres.database | quote }}
          storeUser: {{ .Values.postgres.user | quote }}
          storeSslMode: {{ .Values.postgres.sslMode | quote }}
          {{- if ne (toString .Values.postgres.mtls) "" }}
          storeMtls: {{ .Values.postgres.mtls | quote }}
          {{- end }}
          {{- with .Values.postgres.clientCertFile }}
          storeClientCert: {{ . | quote }}
          {{- end }}
          {{- with .Values.postgres.clientKeyFile }}
          storeClientKey: {{ . | quote }}
          {{- end }}
          {{- with .Values.postgres.caCertFile }}
          storeCaCert: {{ . | quote }}
          {{- end }}
          {{- with .Values.postgres.tlsServerName }}
          storeTlsServerName: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.grafana.retrainCron }}
          retrainCron: {{ .Values.grafana.retrainCron | quote }}
          {{- end }}
          {{- if .Values.compute.enabled }}
          # v16: fitting and the retrain ticker run in the compute Deployment, so this process
          # forwards every POST /forecast to it and starts no retrain ticker. Rendered here (not through
          # `grafana.env`) because the Grafana subchart's value scope cannot see `compute.*`.
          {{- $mtls := toString .Values.compute.mtls }}
          {{- $computeTLS := and (ne $mtls "false") (or .Values.vault.enabled (ne $mtls "") .Values.compute.clientCertFile .Values.compute.serverCertFile) }}
          {{- $serverName := .Values.compute.tlsServerName | default .Values.vault.serverName | default (printf "%s-forecast-compute" .Release.Name) }}
          {{- if $computeTLS }}
          # v19-v22: the hop is mTLS; a Vault role wins over a local pair.
          computeUrl: {{ printf "https://%s-forecast-compute:8080" .Release.Name | quote }}
          computeTlsServerName: {{ $serverName | quote }}
          computeMtls: "true"
          {{- with .Values.compute.clientCertFile }}
          computeClientCert: {{ . | quote }}
          {{- end }}
          {{- with .Values.compute.clientKeyFile }}
          computeClientKey: {{ . | quote }}
          {{- end }}
          {{- with .Values.compute.caCertFile }}
          computeCaCert: {{ . | quote }}
          {{- end }}
          {{- else }}
          computeUrl: {{ printf "http://%s-forecast-compute:8080" .Release.Name | quote }}
          {{- if ne $mtls "" }}
          computeMtls: "false"
          {{- end }}
          {{- end }}
          {{- if .Values.vault.enabled }}
          vaultAddr: {{ .Values.vault.addr | quote }}
          {{- with .Values.vault.namespace }}
          vaultNamespace: {{ . | quote }}
          {{- end }}
          vaultPkiMount: {{ .Values.vault.pkiMount | quote }}
          vaultPkiRole: {{ .Values.vault.pkiRole | quote }}
          {{- with .Values.vault.pvvRole }}
          vaultPvvRole: {{ . | quote }}
          {{- end }}
          vaultCertTtl: {{ .Values.vault.certTtl | quote }}
          {{- with .Values.vault.clientCn }}
          vaultClientCn: {{ . | quote }}
          {{- end }}
          {{- with .Values.vault.clientCertFile }}
          vaultClientCert: {{ . | quote }}
          {{- end }}
          {{- with .Values.vault.clientKeyFile }}
          vaultClientKey: {{ . | quote }}
          {{- end }}
          {{- if ne (toString .Values.vault.mtls) "" }}
          vaultMtls: {{ .Values.vault.mtls | quote }}
          {{- end }}
          {{- with .Values.vault.auth.roleId }}
          vaultRoleId: {{ . | quote }}
          {{- end }}
          {{- with .Values.vault.auth.approleMount }}
          vaultApproleMount: {{ . | quote }}
          {{- end }}
          {{- with .Values.vault.auth.kubernetesRole }}
          vaultK8sRole: {{ . | quote }}
          {{- end }}
          {{- with .Values.vault.auth.kubernetesMount }}
          vaultK8sMount: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if or $host .Values.grafana.pluginToken .Values.compute.enabled }}
        # No credential is written here: Grafana expands each `$VAR` from its own process env,
        # which the Grafana Deployment fills from the <release>-store-credentials and
        # <release>-plugin-credentials Secrets. A literal would be printed by
        # `kubectl get configmap -o yaml`.
        secureJsonData:
          {{- if $host }}
          storePassword: $FORECAST_STORE_PASSWORD
          {{- end }}
          {{- if .Values.grafana.pluginToken }}
          grafanaToken: $FORECAST_GRAFANA_TOKEN
          {{- end }}
          {{- if .Values.compute.enabled }}
          computeToken: $FORECAST_COMPUTE_TOKEN
          {{- end }}
          {{- if and .Values.compute.enabled .Values.vault.enabled }}
          {{- with .Values.vault.auth.token }}
          vaultToken: $FORECAST_VAULT_TOKEN
          {{- end }}
          {{- with .Values.vault.auth.secretId }}
          vaultSecretId: $FORECAST_VAULT_SECRET_ID
          {{- end }}
          {{- end }}
        {{- end }}
{{- end }}
