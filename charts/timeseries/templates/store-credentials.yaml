{{/*
Store credentials, one Secret per release. `postgres.password` is the snapshot-store password for
both consumers, and a ConfigMap would expose it through `kubectl get configmap -o yaml` and
`helm get values`. The Grafana Deployment `envFrom`s this Secret (the documented FORECAST_STORE_*
fallback spelling; the plugin's live configuration is the app's secureJsonData.storePassword) and the
worker Deployment `envFrom`s it next to its env ConfigMap, so the BASELINE_STORE_* block stays in one
place.
*/}}
{{- if or .Values.grafana.enabled .Values.baselines.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-store-credentials
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.grafana.enabled }}
  FORECAST_STORE_PASSWORD: {{ .Values.postgres.password | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.baselines.enabled }}
  BASELINE_STORE_PASSWORD: {{ .Values.postgres.password | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
