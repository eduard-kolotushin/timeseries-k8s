{{/* Always rendered: see druid-datasource-configmap.yaml (the mount is unconditional, so the file must exist). */}}
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus-datasource
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
data:
  prometheus.yaml: |
    apiVersion: 1
    {{- if .Values.prometheusUrl }}
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: {{ .Values.prometheusUrl | quote }}
    {{- else }}
    datasources: []
    {{- end }}
{{- end }}
