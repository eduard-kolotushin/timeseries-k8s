{{- if .Values.grafana.enabled }}
{{/*
The Grafana process's copy of the two tokens the forecast app's backend needs, and of nothing else:
`FORECAST_GRAFANA_TOKEN` authenticates the retrain ticker's `/api/ds/query` calls, and
`FORECAST_COMPUTE_TOKEN` is the bearer token every forwarded `POST /forecast` carries. They are env
here, not `secureJsonData` in the app provisioning ConfigMap (which `kubectl get configmap -o yaml`
would print), because Grafana expands the `$VAR` references in that file from its own process env —
the same mechanism the store password already rides.

Rendered even when both are empty: `extraConfigmapMounts`-style `envFromSecrets` entries are not
conditional, and a missing Secret would leave the Grafana pod in CreateContainerConfigError. The
compute Deployment keeps its own copy in <release>-compute-credentials — that Secret is the service
side, this one the client side.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-plugin-credentials
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.grafana.pluginToken }}
  FORECAST_GRAFANA_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.compute.enabled }}
  FORECAST_COMPUTE_TOKEN: {{ .Values.compute.token | b64enc | quote }}
  {{- end }}
{{- end }}
