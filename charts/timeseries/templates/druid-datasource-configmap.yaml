{{/* Rendered whenever Grafana is on, even with no URL: the subchart's `extraConfigmapMounts` for
this file is unconditional, and an `optional: true` mount of a ConfigMap that does not exist becomes
a *directory* at the file path, which makes Grafana refuse to start ("read …/druid.yaml: is a
directory"). An empty datasource list keeps the file present and provisions nothing. */}}
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-druid-datasource
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
data:
  druid.yaml: |
    apiVersion: 1
    {{- if .Values.druidUrl }}
    datasources:
      - name: Druid
        type: grafadruid-druid-datasource
        uid: druid
        access: proxy
        jsonData:
          connection.url: {{ .Values.druidUrl | quote }}
    {{- else }}
    datasources: []
    {{- end }}
{{- end }}
