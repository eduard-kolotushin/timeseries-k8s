{{- if .Values.baselines.enabled }}
{{- $_ := required "baselines.druidBroker is required when baselines.enabled is true" .Values.baselines.druidBroker }}
{{- $_ := required "baselines.kafkaBrokers is required when baselines.enabled is true" .Values.baselines.kafkaBrokers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timeseries.fullname" . }}-baselines
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.baselines.replicaCount }}
  selector:
    matchLabels:
      {{- include "timeseries.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: baselines
  template:
    metadata:
      {{- with .Values.baselines.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "timeseries.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: baselines
    spec:
      containers:
        - name: baselines
          image: "{{ .Values.baselines.image.registry }}/{{ .Values.baselines.image.repository }}:{{ .Values.baselines.image.tag }}"
          imagePullPolicy: {{ .Values.baselines.image.pullPolicy }}
          env:
            - name: DRUID_BROKER
              value: {{ .Values.baselines.druidBroker | quote }}
            - name: DRUID_DATASOURCE
              value: {{ .Values.baselines.druidDatasource | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.baselines.kafkaBrokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.baselines.kafkaTopic | quote }}
            - name: LOOKBACK
              value: {{ .Values.baselines.lookback | quote }}
            - name: AHEAD_MINUTES
              value: {{ .Values.baselines.aheadMinutes | quote }}
            - name: INTERVAL
              value: {{ .Values.baselines.interval | quote }}
            {{- if .Values.baselines.calendar }}
            - name: CALENDAR
              value: {{ .Values.baselines.calendar | quote }}
            {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.baselines.resources | nindent 12 }}
      {{- with .Values.baselines.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baselines.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.baselines.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
