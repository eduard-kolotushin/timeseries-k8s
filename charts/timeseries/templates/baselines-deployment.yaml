{{- if .Values.baselines.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-baselines
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
    app.kubernetes.io/component: baselines
spec:
  replicas: {{ .Values.baselines.replicas }}
  # A rolling update briefly runs two pods — with one replica, surge-first so publishing never has a
  # gap. The rendezvous peer set tolerates the overlap: a hash the newcomer and the old pod both
  # claim is duplicate work, and the claim queue still fits each retrain row exactly once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "timeseries.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: baselines
  template:
    metadata:
      labels:
        {{- include "timeseries.labels" . | nindent 8 }}
        app.kubernetes.io/component: baselines
      annotations:
        # The worker reads DRUID_BROKER/KAFKA_BROKERS/LOOKBACK from the ConfigMap via envFrom, and
        # env vars are captured at container start. Without this checksum a values-only change edits
        # the ConfigMap, leaves the pod template identical, and helm upgrade reports success while the
        # running workers keep the stale endpoints and peer settings.
        checksum/baselines-env: {{ include (print $.Template.BasePath "/baselines-env-configmap.yaml") . | sha256sum }}
        # BASELINE_STORE_PASSWORD arrives through the store-credentials Secret (the env ConfigMap
        # carries everything else), so a rotated password has to move the pod template too.
        checksum/store-credentials: {{ include (print $.Template.BasePath "/store-credentials.yaml") . | sha256sum }}
    spec:
      # The worker never calls the API server — its peer set comes from the headless Service
      # (SHARD_DNS) or the heartbeat table — so a mounted ServiceAccount token would only widen what
      # a compromised worker could reach.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM cancels the in-flight fit and releases every held claim (one UPDATE per row) instead
      # of waiting out the lease, so a drained pod needs only enough grace to finish those writes;
      # 60s leaves room for a pod stopped mid-Druid-read on top of the default 30s.
      terminationGracePeriodSeconds: 60
      containers:
        - name: baselines
          image: "{{ .Values.baselines.image.registry }}/{{ .Values.baselines.image.repository }}:{{ .Values.baselines.image.tag }}"
          imagePullPolicy: {{ .Values.baselines.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-baselines-env
            - secretRef:
                name: {{ .Release.Name }}-store-credentials
          env:
            # Peers agree on metric_hash ownership by rendezvous hashing, so no coordinator is needed.
            # SHARD_ID is this pod's IP. SHARD_DNS is the bare Service name, which resolves through the
            # pod's own search domains (namespace.svc.<cluster domain>) and so keeps working on a cluster
            # with a custom --cluster-domain.
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SHARD_DNS
              value: "{{ .Release.Name }}-baselines-headless"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.baselines.resources | nindent 12 }}
{{- end }}
