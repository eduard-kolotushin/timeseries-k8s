{{- if .Values.compute.enabled }}
{{- $grafanaUrl := .Values.compute.grafanaUrl }}
{{- if and (not $grafanaUrl) .Values.grafana.enabled }}
{{- $grafanaUrl = printf "http://%s-grafana:80" .Release.Name }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-compute-env
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute
data:
  FORECAST_COMPUTE_LISTEN: {{ .Values.compute.listen | quote }}
  {{- with $grafanaUrl }}
  # Training frames still come from Grafana's own datasource proxy. The plugin's default
  # (http://127.0.0.1:3000) reaches Grafana from inside a Grafana pod and from nowhere else, so this
  # separate pod is pointed at the Grafana Service by default.
  FORECAST_GRAFANA_URL: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.maxInflight }}
  FORECAST_MAX_INFLIGHT: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.retrainCron }}
  FORECAST_RETRAIN_CRON: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.retrainTick }}
  FORECAST_RETRAIN_TICK: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.retrainLease }}
  FORECAST_RETRAIN_LEASE: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.retrainRetryMax }}
  FORECAST_RETRAIN_RETRY_MAX: {{ . | quote }}
  {{- end }}
  {{- with include "timeseries.optional" .Values.compute.snapshotTtl }}
  FORECAST_SNAPSHOT_TTL: {{ . | quote }}
  {{- end }}
  {{- if .Values.vault.enabled }}
  # v19 mTLS. The PKI role issues this service's server certificate; the DNS name is both the
  # certificate's SAN and what the plugin verifies. Credentials come from the Secret.
  FORECAST_VAULT_ADDR: {{ .Values.vault.addr | quote }}
  {{- with .Values.vault.namespace }}
  FORECAST_VAULT_NAMESPACE: {{ . | quote }}
  {{- end }}
  FORECAST_VAULT_PKI_MOUNT: {{ .Values.vault.pkiMount | quote }}
  FORECAST_VAULT_PKI_ROLE: {{ .Values.vault.pkiRole | quote }}
  {{- with .Values.vault.pvvRole }}
  FORECAST_VAULT_PKI_PVV_ROLE: {{ . | quote }}
  {{- end }}
  FORECAST_VAULT_CERT_TTL: {{ .Values.vault.certTtl | quote }}
  {{- with .Values.vault.clientCn }}
  FORECAST_VAULT_CLIENT_CN: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.clientCertFile }}
  FORECAST_VAULT_CLIENT_CERT: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.clientKeyFile }}
  FORECAST_VAULT_CLIENT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.mtls }}
  FORECAST_VAULT_MTLS: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.auth.approleMount }}
  FORECAST_VAULT_APPROLE_MOUNT: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.auth.kubernetesRole }}
  FORECAST_VAULT_K8S_ROLE: {{ . | quote }}
  {{- end }}
  {{- with .Values.vault.auth.kubernetesMount }}
  FORECAST_VAULT_K8S_MOUNT: {{ . | quote }}
  {{- end }}
  FORECAST_COMPUTE_TLS_SERVER_NAME: {{ .Values.vault.serverName | default (printf "%s-forecast-compute" .Release.Name) | quote }}
  {{- end }}
{{- end }}
