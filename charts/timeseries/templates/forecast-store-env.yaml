{{- if or .Values.grafana.enabled .Values.compute.enabled }}
{{- $address := include "timeseries.postgresAddress" (dict "raw" .Values.postgres.url) | splitList "|" }}
{{- $host := index $address 0 }}
{{- $port := index $address 1 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-forecast-store
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
data:
  FORECAST_STORE_HOST: {{ $host | quote }}
  FORECAST_STORE_PORT: {{ $port | quote }}
  FORECAST_STORE_DATABASE: {{ .Values.postgres.database | default "" | quote }}
  FORECAST_STORE_USER: {{ .Values.postgres.user | default "" | quote }}
  # FORECAST_STORE_PASSWORD lives in the <release>-store-credentials Secret: a ConfigMap is readable
  # with `kubectl get configmap -o yaml`. Grafana 12.4+ does not forward host env into plugin
  # processes either, so the plugin's live configuration is the app's secureJsonData.storePassword.
  FORECAST_STORE_SSLMODE: {{ .Values.postgres.sslMode | quote }}
  {{- if ne (toString .Values.postgres.mtls) "" }}
  FORECAST_STORE_MTLS: {{ .Values.postgres.mtls | quote }}
  {{- end }}
  {{- with .Values.postgres.clientCertFile }}
  FORECAST_STORE_CLIENT_CERT: {{ . | quote }}
  {{- end }}
  {{- with .Values.postgres.clientKeyFile }}
  FORECAST_STORE_CLIENT_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.postgres.caCertFile }}
  FORECAST_STORE_CA_CERT: {{ . | quote }}
  {{- end }}
  {{- with .Values.postgres.tlsServerName }}
  FORECAST_STORE_TLS_SERVER_NAME: {{ . | quote }}
  {{- end }}
{{- end }}
