{{- if .Values.compute.enabled }}
{{- $_ := required "compute.token is required when compute.enabled is true" .Values.compute.token }}
{{/*
The compute service's own credentials. `compute.token` is the shared secret the plugin sends as
`Authorization: Bearer …`; `grafana.pluginToken` rides here too because the service fetches its
training frames from Grafana's /api/ds/query, and a ConfigMap would print either through
`kubectl get configmap -o yaml`. The store password is not repeated here: the Deployment also
`envFrom`s the shared <release>-store-credentials Secret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-compute-credentials
  labels:
    {{- include "timeseries.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute
type: Opaque
data:
  FORECAST_COMPUTE_TOKEN: {{ .Values.compute.token | b64enc | quote }}
  {{- with .Values.grafana.pluginToken }}
  FORECAST_GRAFANA_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.vault.enabled }}
  {{- with .Values.vault.auth.token }}
  FORECAST_VAULT_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.vault.auth.roleId }}
  FORECAST_VAULT_ROLE_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.vault.auth.secretId }}
  FORECAST_VAULT_SECRET_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
