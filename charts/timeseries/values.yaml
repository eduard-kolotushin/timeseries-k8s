# Parent-only. When set, ConfigMaps provision Grafana datasources (optional mounts).
druidUrl: ""
prometheusUrl: ""
opensearchUrl: ""
opensearchDatabase: overlay-metrics
# `postgres.url` is the snapshot store / Postgres datasource address, in either spelling:
#   host[:port]                          e.g. overlay-postgres.overlay-postgres.svc:5432
#   scheme://[user[:pass]@]host[:port][/db]   e.g. postgres://overlay:overlay@overlay-postgres:5432/overlay
# A DSN contributes its host (and port) only: `postgres.user`, `postgres.password` and
# `postgres.database` stay the source for credentials and database. A value that yields no host
# fails the render with the value quoted instead of provisioning a bogus one.
# `postgres.sslMode` is the sslmode every render uses (`disable`, `require`, `verify-ca`,
# `verify-full`), so a TLS-required server is reachable through the chart.
postgres:
  url: ""
  database: ""
  user: ""
  password: ""
  sslMode: disable

grafana:
  enabled: true
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-grafana
    # An image tag is an override, not a delivery channel: with `pullPolicy: IfNotPresent` a node
    # that already cached a tag keeps serving that copy, so a rebuilt image must be published under
    # a new immutable tag (a commit sha, or the `vX.Y.Z` release tag) and set here — the sibling
    # sandbox does exactly that in `make helm-images` (`--set grafana.image.tag=<sha>`).
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  testFramework:
    enabled: false
  persistence:
    enabled: true
  # The plugin's fits run in this process, so a single request can allocate here (an unbounded
  # forecast window is one example); without a limit the pod competes with the node instead of
  # being stopped at its own cgroup. Raising `limits.memory` also raises GOMEMLIMIT, which the
  # Grafana subchart derives from that value.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # Backend retrain scheduler. Empty retrainCron leaves the plugin on its own default (0 3 * * *);
  # empty pluginToken sends no Authorization header, which only satisfies a Grafana that does not
  # require auth for /api/ds/query (the sandbox's anonymous Admin). Both are omitted from the app
  # provisioning ConfigMap when empty, so an install that sets neither keeps today's shape.
  retrainCron: ""
  pluginToken: ""
  # Rollout trigger for the ConfigMaps this Deployment mounts. Grafana provisions only at startup
  # and the mounts use subPath, so a change must move the pod template. The Grafana subchart does
  # not template `podAnnotations`; the hooks it does template (`env`, `envFrom*` names, mount
  # fields) render in the subchart's own value scope, which cannot see this chart's `postgres`
  # block — so a store-only change is rolled by bumping this revision (`--set
  # grafana.configRevision=$(date +%s)`), while `retrainCron`/`pluginToken` changes roll on their
  # own through the checksum below.
  configRevision: ""
  env:
    FORECAST_CONFIG_CHECKSUM: '{{ include "timeseries.grafanaConfigChecksum" . }}'
  # Credentials reach the Grafana process as env from Secrets, never as literals in a ConfigMap:
  # Grafana expands the `$FORECAST_*` references in the provisioning files (the app and the Postgres
  # datasource) from this env, and the plugin's `secureJsonData` values resolve through it.
  # <release>-plugin-credentials carries the plugin's own two tokens.
  envFromSecrets:
    - name: '{{ .Release.Name }}-store-credentials'
    - name: '{{ .Release.Name }}-plugin-credentials'
  grafana.ini:
    paths:
      plugins: /opt/grafana-plugins
    plugins:
      allow_loading_unsigned_plugins: eduardkolotushin-forecast-app,eduardkolotushin-forecast-panel,eduardkolotushin-forecast-datasource
  envFromConfigMaps:
    - name: '{{ .Release.Name }}-forecast-store'
  extraConfigmapMounts:
    - name: forecast-app-provisioning
      mountPath: /etc/grafana/provisioning/plugins/forecast-app.yaml
      subPath: apps.yaml
      configMap: '{{ .Release.Name }}-forecast-app'
      readOnly: true
    - name: forecast-datasource
      mountPath: /etc/grafana/provisioning/datasources/forecast.yaml
      subPath: forecast.yaml
      configMap: '{{ .Release.Name }}-forecast-datasource'
      readOnly: true
    - name: druid-datasource
      mountPath: /etc/grafana/provisioning/datasources/druid.yaml
      subPath: druid.yaml
      configMap: '{{ .Release.Name }}-druid-datasource'
      readOnly: true
      optional: true
    - name: prometheus-datasource
      mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
      subPath: prometheus.yaml
      configMap: '{{ .Release.Name }}-prometheus-datasource'
      readOnly: true
      optional: true
    - name: opensearch-datasource
      mountPath: /etc/grafana/provisioning/datasources/opensearch.yaml
      subPath: opensearch.yaml
      configMap: '{{ .Release.Name }}-opensearch-datasource'
      readOnly: true
      optional: true
    - name: postgres-datasource
      mountPath: /etc/grafana/provisioning/datasources/postgres.yaml
      subPath: postgres.yaml
      configMap: '{{ .Release.Name }}-postgres-datasource'
      readOnly: true
      optional: true
  datasources: {}
  extraContainers: ""

baselines:
  enabled: true
  replicas: 1
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-baselines
    # Same rule as the Grafana image above: a rebuilt worker needs a new immutable tag.
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  druidBroker: ""
  druidDatasource: metrics
  # DRUID_MAX_RANGE: the longest time span one Druid SQL request may cover. The worker slices longer
  # windows into consecutive requests of at most this width; 0 keeps one request per read.
  druidMaxRange: 0
  druidMaxRps: 4
  trainConcurrency: 2
  # The span scan is cached: an unscoped GROUP BY metric_hash per tick is what HASH_SCAN_TTL removes.
  hashScanTtl: 5m
  # Empty leaves WORKER_TTL to the worker, which derives max(30s, 2*INTERVAL) so a
  # heartbeat cannot age out between ticks. Set it only to override that, and keep
  # it longer than `interval`.
  workerTtl: ""
  # dns keeps the headless Service peer discovery below; the sandbox Helm values switch this to store.
  membership: dns
  # Host (and optional `:port`) of the store when it differs from the `postgres.url` host — e.g. the
  # in-cluster Service DNS name of the same database. Credentials/database still come from `postgres.*`.
  storeHost: ""
  defaultRetrainCron: "0 3 * * *"
  kafkaBrokers: ""
  kafkaTopic: baselines
  lookback: 336h
  aheadMinutes: 1
  interval: 1m
  calendar: ""
  # The remaining worker knobs below are read by timeseries-baselines from the process env and are
  # rendered into `<release>-baselines-env` only when set, so an empty value keeps the worker's own
  # default. The default is quoted in each comment.
  # info (default) | debug — debug turns on per-tick Druid and publish logging.
  logLevel: ""
  # Whole-request Druid timeout. Default 60s.
  druidTimeout: ""
  # Druid request retries. Default 2; `0` disables them (a real setting, so it renders).
  druidRetries: ""
  # Druid requests in flight. Default 4.
  druidMaxInflight: ""
  # Static auth header/value for a Druid behind a proxy, e.g. header `Authorization` and value
  # `Basic <base64>`. Both default to empty (no header).
  druidAuthHeader: ""
  druidAuthValue: ""
  # Bounded hash-scan window. Default max(2*lookback, 24h); it must be at least lookback + 2*interval
  # or the worker rejects the config, because the window clamps a hash's Min and excludes now.
  scanRange: ""
  # Snapshot-freshness cache that throttles the per-tick snapshot query. Default 60s.
  snapshotCacheTtl: ""
  # The retry backoff's base delay and the claim lease's floor — not the lease itself: the worker
  # claims with RETRAIN_LEASE (below) so one fit, up to ceil(lookback / druidMaxRange) sequential
  # Druid requests, cannot outlive its claim and be retrained twice at once. Default 5m.
  retrainRetry: ""
  # Claim lease. Empty derives it from the work: max(retrainRetry, ceil(lookback / druidMaxRange)
  # * druidTimeout + 1m) — 15m at the defaults (336h / 24h / 60s).
  retrainLease: ""
  # Cap on the retry backoff (default 1h). The worker refuses one that does not exceed
  # retrainRetry, because that would be a fixed delay rather than a backoff.
  retrainRetryMax: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Standalone compute service (forecast plugin v16). When enabled, the plugin process in Grafana
# forwards every POST /forecast to this Deployment and starts no retrain ticker: fitting and the
# ticker live here, so capacity scales with `compute.replicas` instead of Grafana replicas. Default
# off keeps today's inline behaviour. Replicas share `postgres.*`, and the forecast.retrain claim
# queue hands each due row to exactly one of them.
compute:
  enabled: false
  replicas: 2
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-forecast-compute
    # Same rule as the other images: a rebuilt service needs a new immutable tag.
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Address the service listens on inside the pod (`FORECAST_COMPUTE_LISTEN`). The Service and the
  # plugin's computeUrl both use port 8080, so change this only together with the chart's Service.
  listen: ":8080"
  # Shared secret the plugin sends as `Authorization: Bearer …`. Required when enabled: the render
  # fails without it, because the service refuses to start unauthenticated.
  token: ""
  # Frames are still fetched through Grafana's own /api/ds/query. Empty renders the in-cluster
  # Grafana Service (`http://<release>-grafana:80`), which is what a separate pod needs — the
  # plugin's own default (`http://127.0.0.1:3000`) only works inside a Grafana pod.
  grafanaUrl: ""
  # Concurrent fits in this Deployment (`FORECAST_MAX_INFLIGHT`). The plugin process's own limiter
  # bounds forwards, not fits, so this is the knob that sizes compute CPU.
  maxInflight: ""
  # Retrain scheduler of the service (the plugin's is off in this mode). Empty keeps the plugin's
  # defaults: cron `0 3 * * *`, tick `30s`, lease `6m`, retry cap `1h`, snapshot TTL `72h`.
  retrainCron: ""
  retrainTick: ""
  retrainLease: ""
  retrainRetryMax: ""
  snapshotTtl: ""
  # Optional mounts for files the service needs, e.g. the v21 Vault client certificate pair.
  extraVolumes: []
  extraVolumeMounts: []
  # CPU limit 200m: a fit is CPU-bound, so this is what keeps a burst of large fits from starving
  # the rest of the node (Grafana, the datasources and the store usually share it). It throttles the
  # service, not the caller: with `maxInflight` slots per pod, throughput becomes roughly
  # `maxInflight / (fit CPU / 0.2)` instead of "as many as the node has cores". Raise it (or drop it)
  # where the compute Deployment has the node to itself — a 100k-point fit measured ~20 ms unlimited
  # and is measured in the hundreds of ms under this limit.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 2Gi

# Vault PKI mTLS for the compute hop and optional client certificates (plugin v19-v21). Only
# meaningful with `compute.enabled`. When enabled, the plugin forwards to `https://<release>-forecast-compute:8080`
# and the compute service listens TLS-only, requiring a client certificate issued by Vault.
# Certificates are re-issued at half their remaining lifetime; no restart is needed to rotate.
# Credentials live only in the two existing Secrets (<release>-plugin-credentials and
# <release>-compute-credentials), never in a ConfigMap.
vault:
  enabled: false
  # Vault address, e.g. https://vault.vault.svc:8200.
  addr: ""
  namespace: ""
  pkiMount: pki
  # Role the service uses to issue its server certificate, and the client role the plugin uses.
  # `pkiRole` is required when enabled.
  pkiRole: ""
  # Optional: issue the PVV retrain client certificate from this role too.
  pvvRole: ""
  certTtl: 24h
  # DNS name the compute service's certificate is issued for and verified against.
  # Empty renders <release>-forecast-compute.
  serverName: ""
  # Common name the plugin's client certificate is issued with. Empty keeps the plugin default.
  clientCn: ""
  # v21: client-certificate mTLS to Vault itself. The files must be mounted into both the Grafana
  # and compute pods (e.g. with grafana.extraVolumes / compute.extraVolumes); the chart sets the
  # paths only. Empty mtls leaves the plugin default: on when either path is set.
  clientCertFile: ""
  clientKeyFile: ""
  mtls: ""
  # One auth method: token, AppRole (roleId+secretId), or Kubernetes (kubernetesRole).
  auth:
    token: ""
    roleId: ""
    secretId: ""
    kubernetesRole: ""
    kubernetesMount: ""
    approleMount: ""
