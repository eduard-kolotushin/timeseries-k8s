# Parent-only. When set, a ConfigMap provisions grafadruid-druid-datasource (uid druid).
druidUrl: ""

grafana:
  enabled: true
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-grafana
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  testFramework:
    enabled: false
  persistence:
    enabled: true
  grafana.ini:
    paths:
      plugins: /opt/grafana-plugins
    plugins:
      allow_loading_unsigned_plugins: eduardkolotushin-forecast-app,eduardkolotushin-forecast-panel
  env:
    GF_PATHS_PLUGINS: /opt/grafana-plugins
    GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: eduardkolotushin-forecast-app,eduardkolotushin-forecast-panel
  extraConfigmapMounts:
    - name: forecast-app-provisioning
      mountPath: /etc/grafana/provisioning/plugins/forecast-app.yaml
      subPath: apps.yaml
      configMap: '{{ .Release.Name }}-forecast-app'
      readOnly: true
    - name: druid-datasource
      mountPath: /etc/grafana/provisioning/datasources/druid.yaml
      subPath: druid.yaml
      configMap: '{{ .Release.Name }}-druid-datasource'
      readOnly: true
      optional: true
  datasources: {}

baselines:
  enabled: true
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-baselines
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  druidBroker: ""
  druidDatasource: metrics
  kafkaBrokers: ""
  kafkaTopic: baselines
  lookback: 336h
  aheadMinutes: 1
  interval: 1m
  calendar: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
