# Parent-only. When set, ConfigMaps provision Grafana datasources (optional mounts).
druidUrl: ""
prometheusUrl: ""
opensearchUrl: ""
opensearchDatabase: overlay-metrics
postgres:
  url: ""
  database: ""
  user: ""
  password: ""

grafana:
  enabled: true
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-grafana
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  testFramework:
    enabled: false
  persistence:
    enabled: true
  grafana.ini:
    paths:
      plugins: /opt/grafana-plugins
    plugins:
      allow_loading_unsigned_plugins: eduardkolotushin-forecast-app,eduardkolotushin-forecast-panel,eduardkolotushin-forecast-datasource
  envFromConfigMaps:
    - name: '{{ .Release.Name }}-forecast-store'
  extraConfigmapMounts:
    - name: forecast-app-provisioning
      mountPath: /etc/grafana/provisioning/plugins/forecast-app.yaml
      subPath: apps.yaml
      configMap: '{{ .Release.Name }}-forecast-app'
      readOnly: true
    - name: forecast-datasource
      mountPath: /etc/grafana/provisioning/datasources/forecast.yaml
      subPath: forecast.yaml
      configMap: '{{ .Release.Name }}-forecast-datasource'
      readOnly: true
    - name: druid-datasource
      mountPath: /etc/grafana/provisioning/datasources/druid.yaml
      subPath: druid.yaml
      configMap: '{{ .Release.Name }}-druid-datasource'
      readOnly: true
      optional: true
    - name: prometheus-datasource
      mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
      subPath: prometheus.yaml
      configMap: '{{ .Release.Name }}-prometheus-datasource'
      readOnly: true
      optional: true
    - name: opensearch-datasource
      mountPath: /etc/grafana/provisioning/datasources/opensearch.yaml
      subPath: opensearch.yaml
      configMap: '{{ .Release.Name }}-opensearch-datasource'
      readOnly: true
      optional: true
    - name: postgres-datasource
      mountPath: /etc/grafana/provisioning/datasources/postgres.yaml
      subPath: postgres.yaml
      configMap: '{{ .Release.Name }}-postgres-datasource'
      readOnly: true
      optional: true
  datasources: {}
  # Sidecar image must match baselines.image. Disable with baselines.enabled=false
  # and --set grafana.extraContainers="" .
  extraContainers: |
    - name: baselines
      image: ghcr.io/eduard-kolotushin/timeseries-baselines:0.1.0
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-baselines-env
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

baselines:
  enabled: true
  image:
    registry: ghcr.io
    repository: eduard-kolotushin/timeseries-baselines
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  druidBroker: ""
  druidDatasource: metrics
  kafkaBrokers: ""
  kafkaTopic: baselines
  lookback: 336h
  aheadMinutes: 1
  interval: 1m
  calendar: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
