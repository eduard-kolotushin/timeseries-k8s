grafana:
  # Renders the app's `grafanaToken: $FORECAST_GRAFANA_TOKEN` reference and the
  # <release>-plugin-credentials Secret that backs it, so `make lint` and the render checks below
  # cover the token path too.
  pluginToken: ci-plugin-token
baselines:
  druidBroker: http://druid-broker.example.svc:8082
  kafkaBrokers: kafka.example.svc:9092
# Renders the v16 compute Deployment/Service/ConfigMap and the app's computeUrl/computeToken, so
# `make lint` covers the new templates.
compute:
  enabled: true
  token: ci-token
