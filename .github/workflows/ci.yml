name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint and template
        run: make lint
      - name: Render non-default postgres and rollout values
        # The three renders the 2026-09 remediation added — `postgres.sslMode`, the store Secret and
        # the `configRevision` rollout — had no CI coverage; `make lint` only renders the defaults.
        run: |
          out=$(helm template test charts/timeseries -f ci/values.yaml \
            --set postgres.url=postgres://u:p@h.example:5432/db \
            --set postgres.sslMode=require \
            --set grafana.configRevision=ci)
          echo "$out" | grep -q 'FORECAST_STORE_SSLMODE: "require"'
          echo "$out" | grep -q 'BASELINE_STORE_SSLMODE: "require"'
          echo "$out" | grep -q 'FORECAST_STORE_HOST: "h.example"'
          echo "$out" | grep -q 'FORECAST_CONFIG_CHECKSUM'
          echo "$out" | grep -q 'name: test-store-credentials'
      - name: Check image pins against the sibling heads
        # A Dockerfile pin that is neither the sibling head nor an ancestor of it builds stale
        # code into a released image, which is what `make lint` cannot see.
        run: make check-pins

  images:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "raw=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and push Grafana image
        uses: docker/build-push-action@v6
        with:
          context: docker/grafana
          file: docker/grafana/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eduard-kolotushin/timeseries-grafana:${{ steps.tags.outputs.version }}
            ghcr.io/eduard-kolotushin/timeseries-grafana:${{ steps.tags.outputs.raw }}
      - name: Build and push baselines image
        uses: docker/build-push-action@v6
        with:
          context: docker/baselines
          file: docker/baselines/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eduard-kolotushin/timeseries-baselines:${{ steps.tags.outputs.version }}
            ghcr.io/eduard-kolotushin/timeseries-baselines:${{ steps.tags.outputs.raw }}
