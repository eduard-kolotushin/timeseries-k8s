name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint and template
        run: make lint
      - name: Render non-default postgres and rollout values
        # The three renders the 2026-09 remediation added — `postgres.sslMode`, the store Secret and
        # the `configRevision` rollout — had no CI coverage; `make lint` only renders the defaults.
        run: |
          out=$(helm template test charts/timeseries -f ci/values.yaml \
            --set postgres.url=postgres://u:p@h.example:5432/db \
            --set postgres.sslMode=require \
            --set grafana.configRevision=ci)
          echo "$out" | grep -q 'FORECAST_STORE_SSLMODE: "require"'
          echo "$out" | grep -q 'BASELINE_STORE_SSLMODE: "require"'
          echo "$out" | grep -q 'FORECAST_STORE_HOST: "h.example"'
          echo "$out" | grep -q 'FORECAST_CONFIG_CHECKSUM'
          echo "$out" | grep -q 'name: test-store-credentials'
      - name: Render the compute service
        # ci/values.yaml enables compute, so the Deployment/Service/ConfigMap and the app's
        # computeUrl/computeToken render here; the default values must produce none of it.
        run: |
          out=$(helm template test charts/timeseries -f ci/values.yaml)
          echo "$out" | grep -q 'name: test-forecast-compute'
          echo "$out" | grep -q 'FORECAST_COMPUTE_LISTEN: ":8080"'
          echo "$out" | grep -q 'FORECAST_GRAFANA_URL: "http://test-grafana:80"'
          echo "$out" | grep -q 'computeUrl: "http://test-forecast-compute:8080"'
          # The tokens are `$VAR` references Grafana expands from the Grafana Deployment's env (the
          # <release>-plugin-credentials Secret): the provisioning ConfigMap must hold no literal.
          echo "$out" | grep -q 'computeToken: \$FORECAST_COMPUTE_TOKEN'
          echo "$out" | grep -q 'grafanaToken: \$FORECAST_GRAFANA_TOKEN'
          echo "$out" | grep -q 'name: test-plugin-credentials'
          echo "$out" | grep -q 'FORECAST_COMPUTE_TOKEN'
          plain=$(helm template test charts/timeseries -f ci/values.yaml --set compute.enabled=false)
          if echo "$plain" | grep -q 'forecast-compute'; then
            echo "compute.enabled=false still rendered the compute service" >&2; exit 1
          fi
          if echo "$plain" | grep -q 'computeUrl:'; then
            echo "compute.enabled=false still rendered computeUrl" >&2; exit 1
          fi
          # v19: vault.enabled switches the hop to https and renders the Vault env/jsonData.
          vout=$(helm template test charts/timeseries -f ci/values.yaml \
            --set vault.enabled=true \
            --set vault.addr=https://vault:8200 \
            --set vault.pkiRole=forecast-compute \
            --set vault.auth.token=vtoken)
          echo "$vout" | grep -q 'computeUrl: "https://test-forecast-compute:8080"'
          echo "$vout" | grep -q 'computeTlsServerName: "test-forecast-compute"'
          echo "$vout" | grep -q 'vaultToken: \$FORECAST_VAULT_TOKEN'
          echo "$vout" | grep -q 'FORECAST_VAULT_ADDR: "https://vault:8200"'
          echo "$vout" | grep -q 'FORECAST_VAULT_PKI_ROLE: "forecast-compute"'
          echo "$vout" | grep -q 'FORECAST_COMPUTE_TLS_SERVER_NAME: "test-forecast-compute"'
      - name: Render a URL-less install
        # The subchart's datasource ConfigMap mounts are unconditional, so an `optional: true` mount
        # of a ConfigMap that does not exist becomes a *directory* at the file path and Grafana
        # refuses to start ("read …/druid.yaml: is a directory"). Every one of those files must exist
        # even with no URL, carrying an empty datasource list.
        run: |
          out=$(helm template test charts/timeseries -f ci/values.yaml \
            --set postgres.url= --set druidUrl= --set prometheusUrl= --set opensearchUrl=)
          for n in druid prometheus opensearch postgres; do
            echo "$out" | grep -q "name: test-$n-datasource" || { echo "no $n datasource ConfigMap" >&2; exit 1; }
          done
          echo "$out" | grep -q 'datasources: \[\]'
      - name: Render no credential into a ConfigMap
        # A credential literal in a provisioning ConfigMap is readable with `kubectl get configmap
        # -o yaml`. Grafana expands the `$VAR` references in those files from the Grafana
        # Deployment's env, which the two Secret envFroms fill — so the ConfigMaps must contain a
        # reference and no value, and the Secrets must contain the values.
        run: |
          set -e
          probe_args='--set postgres.url=postgres://u:p@h.example:5432/db --set postgres.password=PROBEPW1 --set grafana.pluginToken=PROBETOK2 --set compute.token=PROBETOK3 --set vault.enabled=true --set vault.addr=https://vault:8200 --set vault.pkiRole=forecast-compute --set vault.auth.token=PROBEVAULT4'
          for f in forecast-app postgres-datasource forecast-datasource; do
            rendered=$(helm template test charts/timeseries -f ci/values.yaml $probe_args \
              --show-only "templates/$f-configmap.yaml")
            if echo "$rendered" | grep -q 'PROBEPW1\|PROBETOK2\|PROBETOK3\|PROBEVAULT4'; then
              echo "$f renders a credential literal" >&2; exit 1
            fi
            echo "$rendered" | grep -q '\$FORECAST_' || {
              echo "$f renders no credential reference" >&2; exit 1; }
          done
          secrets=$(helm template test charts/timeseries -f ci/values.yaml $probe_args \
            --show-only templates/plugin-credentials.yaml \
            --show-only templates/compute-credentials.yaml \
            --show-only templates/store-credentials.yaml)
          for v in PROBEPW1 PROBETOK2 PROBETOK3 PROBEVAULT4; do
            echo "$secrets" | grep -q "$(printf '%s' "$v" | base64 -w0)" || {
              echo "$v is in no Secret" >&2; exit 1; }
          done
      - name: Check image pins against the sibling heads
        # A Dockerfile pin that is neither the sibling head nor an ancestor of it builds stale
        # code into a released image, which is what `make lint` cannot see.
        run: make check-pins

  images:
    needs: helm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "raw=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Build and push Grafana image
        uses: docker/build-push-action@v6
        with:
          context: docker/grafana
          file: docker/grafana/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eduard-kolotushin/timeseries-grafana:${{ steps.tags.outputs.version }}
            ghcr.io/eduard-kolotushin/timeseries-grafana:${{ steps.tags.outputs.raw }}
      - name: Build and push baselines image
        uses: docker/build-push-action@v6
        with:
          context: docker/baselines
          file: docker/baselines/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eduard-kolotushin/timeseries-baselines:${{ steps.tags.outputs.version }}
            ghcr.io/eduard-kolotushin/timeseries-baselines:${{ steps.tags.outputs.raw }}
      - name: Build and push compute image
        uses: docker/build-push-action@v6
        with:
          context: docker/compute
          file: docker/compute/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/eduard-kolotushin/timeseries-forecast-compute:${{ steps.tags.outputs.version }}
            ghcr.io/eduard-kolotushin/timeseries-forecast-compute:${{ steps.tags.outputs.raw }}
